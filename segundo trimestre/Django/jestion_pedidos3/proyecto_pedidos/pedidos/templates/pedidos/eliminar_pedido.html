<!DOCTYPE html>
<html>
<head>
    <title>Eliminar Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

<div class="card shadow text-center" style="width: 400px;">
    
    <div class="card-header bg-danger text-white">
        <h5 class="mb-0">Eliminar Pedido</h5>
    </div>

    <div class="card-body">
        <p>¿Estás seguro de eliminar el pedido de:</p>
        <p><strong>{{ pedido.cliente }} - {{ pedido.producto }}</strong></p>

        <form method="post">
            {% csrf_token %}
            
            <div class="d-flex justify-content-between mt-4">
                <!-- Botón volver -->
                <a href="{% url 'listar_pedidos' %}" class="btn btn-secondary">
                    Cancelar
                </a>

                <!-- Botón eliminar -->
                <button type="submit" class="btn btn-danger">
                    Sí, Eliminar
                </button>
            </div>

        </form>
    </div>

</div>

</body>
</html>
