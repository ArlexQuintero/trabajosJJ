<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Eliminar Producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="card shadow mx-auto" style="max-width: 450px">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0">Eliminar Producto</h5>
      </div>
      <div class="card-body text-center">
        <p class="mb-1">Estás a punto de eliminar el producto:</p>
        <h5 class="text-danger mb-3">{{ producto.nombre }}</h5>

        <!-- Formulario oculto que se envía tras confirmar -->
        <form method="POST" id="formEliminar">{% csrf_token %}</form>

        <a href="{% url 'listar_productos' %}" class="btn btn-secondary me-2"
          >Cancelar</a
        >
        <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">
          Eliminar
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document
        .getElementById("btnConfirmarEliminar")
        .addEventListener("click", function () {
          Swal.fire({
            title: "¿Confirmar eliminación?",
            html: "Vas a eliminar el producto <strong>{{ producto.nombre }}</strong>.<br>Esta acción no se puede deshacer.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#dc3545",
            cancelButtonColor: "#6c757d",
            confirmButtonText: "Sí, eliminar definitivamente",
            cancelButtonText: "No, cancelar",
          }).then((result) => {
            if (result.isConfirmed) {
              document.getElementById("formEliminar").submit();
            }
          });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
