<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        h1   { color: #1a1a2e; text-align: center; margin-bottom: 5px; }
        .fecha { text-align: center; color: #666; margin-bottom: 20px; font-size: 11px; }
        table { width: 100%; border-collapse: collapse; }
        thead th { background-color: #1a1a2e; color: white; padding: 8px; text-align: center; }
        tbody td { padding: 6px 8px; border-bottom: 1px solid #ddd; text-align: center; }
        tbody tr:nth-child(even) { background-color: #f8f9fa; }
        .footer { margin-top: 20px; text-align: right; font-size: 10px; color: #999; }
    </style>
</head>
<body>
    <h1>Listado de Clientes</h1>
    <p class="fecha">Generado el {% now "d/m/Y H:i" %}</p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Dirección</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.id }}</td>
                <td>{{ cliente.nombre }}</td>
                <td>{{ cliente.correo }}</td>
                <td>{{ cliente.direccion }}</td>
                <td>{{ cliente.telefono }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <p class="footer">Total de clientes: {{ clientes.count }}</p>
</body>
</html>
